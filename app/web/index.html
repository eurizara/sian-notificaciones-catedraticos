<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Avisos y alertas institucionales para catedráticos. Universidad Mariano Gálvez de Guatemala, sede Boca del Monte.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1C72A5">
  <meta name="apple-mobile-web-app-title" content="SIAN UMG-BDM">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">

  <!-- Favicon -->
  <!-- Varios tamaños y formatos: los navegadores eligen distinto, y el .ico
       sigue siendo el que menos discute. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/Icon-16.png"/>
  <link rel="icon" type="image/png" sizes="48x48" href="icons/Icon-48.png"/>

  <title>SIAN UMG-BDM — Avisos y Notificaciones</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      NADA de `overflow: hidden` ni de `height: 100%` aquí.

      Se probaron, y rompieron el desplazamiento vertical dentro de la
      aplicación en iOS: Flutter monta su propia vista y gestiona el
      desplazamiento por su cuenta, así que fijar el alto del documento le
      quita el sitio por el que se mueve. La cura salió peor que la
      enfermedad.

      `overscroll-behavior-x` sí es seguro: solo cancela el rebote lateral y
      la navegación por arrastre en los navegadores que la implementan, sin
      tocar el desplazamiento vertical.
    */
    html, body {
      margin: 0;
      padding: 0;
      overscroll-behavior-x: none;
    }

    /*
      El arrastre horizontal no navega hacia atrás.

      `touch-action: pan-y` le dice al navegador que en esta página los
      gestos horizontales no son suyos. Es lo que de verdad frena el
      deslizamiento lateral, y deja intacto el vertical.

      En Safari sobre iOS el gesto desde el borde exacto de la pantalla sigue
      siendo del sistema y no hay forma de cancelarlo desde la web. Instalada
      en la pantalla de inicio ese gesto no existe, que es otra razón para el
      instructivo de instalación.
    */
    body, flutter-view, flt-glass-pane {
      touch-action: pan-y;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    /*
      Atrapa la navegación hacia atrás para que no saque de la aplicación.

      El CSS de arriba frena el arrastre lateral en casi todo, pero en Safari
      sobre iOS el gesto que nace en el borde exacto de la pantalla pertenece
      al sistema y ninguna página web puede cancelarlo. Lo que sí se puede es
      que no lleve a ninguna parte.

      Se deja una entrada de historial propia al arrancar. Cuando el gesto la
      consume, se vuelve a poner: el navegador cree que retrocedió y la
      persona se queda donde estaba, en vez de mirar una pantalla en blanco.

      Es seguro aquí porque SIAN no usa la barra de direcciones para navegar:
      es una sola página cuyo contenido depende de la sesión. En una
      aplicación con rutas reales esto rompería el botón de atrás.
    */
    (function () {
      var marca = { sian: true };
      history.pushState(marca, '');

      window.addEventListener('popstate', function () {
        history.pushState(marca, '');
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name: Despliegue

# Esquema del documento 06, etapa F.1.
#
#   develop → sian-umg-bdm-qa   automático
#   main    → sian-umg-bdm-prod con aprobación manual obligatoria
#
# Ningún secreto vive en el repositorio (RNF-10): todos entran por los secrets
# de GitHub Actions declarados en el documento 06, etapa F.2.

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: Desplegar a QA
    # `vars.QA_PROJECT_ID` actúa de interruptor: mientras el ambiente QA no
    # exista (iteración 2.1 del documento 08), el trabajo se omite en vez de
    # fallar. Un repositorio en rojo permanente enseña a ignorar el rojo.
    if: github.ref == 'refs/heads/develop' && vars.QA_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Compilar y probar las Functions
        run: |
          npm ci --prefix functions
          npm run lint --prefix functions
          npm run build --prefix functions
          npm test --prefix functions

      - name: Compilar la aplicación web
        if: hashFiles('app/pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'

      - name: Generar firebase_options.dart
        if: hashFiles('app/pubspec.yaml') != ''
        run: bash scripts/generar-firebase-options.sh
        env:
          FIREBASE_API_KEY: ${{ vars.QA_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.QA_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.QA_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.QA_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.QA_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.QA_STORAGE_BUCKET }}

      - name: Construir la PWA
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=FIREBASE_VAPID_KEY=${{ secrets.QA_VAPID_KEY }} \
            --dart-define=USE_EMULATOR=false

      - name: Desplegar reglas, índices y Functions
        uses: w9jds/firebase-action@v13.24.1
        with:
          args: deploy --only firestore:rules,firestore:indexes,storage,functions --project ${{ vars.QA_PROJECT_ID }}
        env:
          GCP_SA_KEY: ${{ secrets.QA_SERVICE_ACCOUNT }}

      - name: Desplegar Hosting
        if: hashFiles('app/pubspec.yaml') != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.QA_SERVICE_ACCOUNT }}
          projectId: ${{ vars.QA_PROJECT_ID }}
          channelId: live

  produccion:
    name: Desplegar a producción
    # Mismo interruptor que en QA: producción se habilita en la iteración 3.1,
    # y además exige aprobación manual por el ambiente `produccion`.
    if: github.ref == 'refs/heads/main' && vars.PROD_PROJECT_ID != ''
    runs-on: ubuntu-latest
    # El ambiente `produccion` exige revisores obligatorios en
    # Settings → Environments: ningún despliegue ocurre sin aprobación explícita.
    environment: produccion
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Compilar y probar las Functions
        run: |
          npm ci --prefix functions
          npm run lint --prefix functions
          npm run build --prefix functions
          npm test --prefix functions

      - name: Compilar la aplicación web
        if: hashFiles('app/pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'

      - name: Generar firebase_options.dart
        if: hashFiles('app/pubspec.yaml') != ''
        run: bash scripts/generar-firebase-options.sh
        env:
          FIREBASE_API_KEY: ${{ vars.PROD_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.PROD_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PROD_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.PROD_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.PROD_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.PROD_STORAGE_BUCKET }}

      - name: Construir la PWA
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=FIREBASE_VAPID_KEY=${{ secrets.PROD_VAPID_KEY }} \
            --dart-define=USE_EMULATOR=false

      - name: Desplegar reglas, índices y Functions
        uses: w9jds/firebase-action@v13.24.1
        with:
          args: deploy --only firestore:rules,firestore:indexes,storage,functions --project ${{ vars.PROD_PROJECT_ID }}
        env:
          GCP_SA_KEY: ${{ secrets.PROD_SERVICE_ACCOUNT }}

      - name: Desplegar Hosting
        if: hashFiles('app/pubspec.yaml') != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.PROD_SERVICE_ACCOUNT }}
          projectId: ${{ vars.PROD_PROJECT_ID }}
          channelId: live

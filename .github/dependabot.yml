# SIAN — Auditoría automática de dependencias (documento 02, sección 9).
#
# A 26/09/2026 Dependabot no había abierto ni un pull request en este
# repositorio. Las actualizaciones de npm y pub las lleva desde 1.6.12 el flujo
# `actualizar-dependencias.yml`, una vez al mes y en un solo pull request; aquí
# quedan solo las acciones de GitHub. Si Dependabot vuelve a abrir PR de npm o
# pub, es que alguien restauró esas entradas: dos mecanismos para lo mismo
# acaban en PR duplicados.
#
# Las actualizaciones llegan como pull request contra `develop`, nunca contra
# `main`: producción solo recibe lo que ya pasó por QA (regla de gobierno 2 del
# documento 08).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: America/Guatemala
    target-branch: develop
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - dependencias
